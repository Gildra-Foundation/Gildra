openapi: 3.1.0
info:
  title: Gildra API
  version: 1.0.0
  description: Contract shared by the Go backend and the Next.js frontend.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
security: []
servers:
  - url: https://api.gildra.net
  - url: https://gildra.net/api
paths:
  /v1:
    get:
      operationId: getAPIIndex
      summary: Discover the stable v1 API surfaces.
      responses:
        "200":
          description: API entry point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIIndex"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/game/products:
    get:
      operationId: listGameProducts
      summary: List supported World of Warcraft products.
      responses:
        "200":
          description: Supported products.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GameProduct"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/game/entities:
    get:
      operationId: listGameEntities
      summary: Search and page through versioned game entities.
      parameters:
        - in: query
          name: product
          schema:
            type: string
            minLength: 2
            maxLength: 64
        - in: query
          name: type
          schema:
            type: string
            minLength: 2
            maxLength: 64
        - in: query
          name: locale
          schema:
            type: string
            enum: [en_US, ru_RU]
            default: en_US
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: cursor
          description: Opaque cursor from the previous response.
          schema:
            type: string
            maxLength: 128
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Cursor-paginated game entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameEntityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/game/entities/{id}:
    get:
      operationId: getGameEntity
      summary: Get the latest version of a game entity.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: locale
          schema:
            type: string
            enum: [en_US, ru_RU]
            default: en_US
      responses:
        "200":
          description: Game entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameEntity"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /livez:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether required datastores are ready.
      responses:
        "200":
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      summary: Read an aggregated analytics overview.
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            minimum: 1
            maximum: 720
            default: 24
      responses:
        "200":
          description: Aggregated product analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/analytics/events:
    post:
      operationId: ingestAnalyticsEvents
      summary: Ingest a batch of product analytics events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventsRequest"
      responses:
        "202":
          description: Events accepted for async insertion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/indexnow:
    post:
      operationId: submitIndexNow
      summary: Queue URLs for IndexNow submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexNowRequest"
      responses:
        "202":
          description: IndexNow submission queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    APIIndex:
      type: object
      required: [version, rest, graphql]
      properties:
        version:
          type: string
          const: v1
        rest:
          type: string
          format: uri
        graphql:
          type: string
          format: uri
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    GameProduct:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
    GameEntity:
      type: object
      required: [id, product, type, externalId, slug, locale, name, description, payload, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        product:
          type: string
        type:
          type: string
        externalId:
          type: integer
          format: int64
        slug:
          type: string
        locale:
          type: string
          enum: [en_US, ru_RU]
        name:
          type: string
        description:
          type: string
        buildId:
          type: integer
          format: int64
        payload:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
    CursorPage:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: string
        hasMore:
          type: boolean
    GameEntityPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GameEntity"
        pagination:
          $ref: "#/components/schemas/CursorPage"
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    AnalyticsPoint:
      type: object
      required: [hour, events, uniqueUsers]
      properties:
        hour:
          type: string
          format: date-time
        events:
          type: integer
          format: int64
        uniqueUsers:
          type: integer
          format: int64
    AnalyticsOverview:
      type: object
      required: [hours, events, uniqueUsers, activeSubscriptions, series]
      properties:
        hours:
          type: integer
        events:
          type: integer
          format: int64
        uniqueUsers:
          type: integer
          format: int64
        activeSubscriptions:
          type: integer
          format: int64
        series:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsPoint"
    AnalyticsEvent:
      type: object
      required: [eventName, path, locale, sessionId]
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
          minLength: 1
          maxLength: 100
        occurredAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        path:
          type: string
          maxLength: 2048
        locale:
          type: string
          enum: [en, ru]
        value:
          type: number
          format: double
        properties:
          type: object
          additionalProperties: true
    IngestEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/AnalyticsEvent"
    IngestEventsResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
    IndexNowRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            format: uri
    QueuedResponse:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
