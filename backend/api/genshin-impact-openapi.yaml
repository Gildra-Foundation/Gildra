openapi: 3.1.0
info:
  title: Gildra Genshin Impact API
  version: 1.0.0
  description: Read-only bilingual catalog backed by atomic local PostgreSQL releases.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.gildra.net/genshin-impact/v1
paths:
  /:
    get:
      operationId: getGenshinAPIIndex
      summary: Discover Genshin Impact API resources.
      security: []
      responses:
        "200":
          description: API resource links and supported locales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIIndex"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /status:
    get:
      operationId: getGenshinCatalogStatus
      summary: Get the active release and catalog coverage.
      security: []
      responses:
        "200":
          description: Current publication state and entity counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStatus"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /characters:
    get:
      operationId: listGenshinCharacters
      summary: Search and filter characters from the active release.
      security: []
      parameters:
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Rarity"
        - name: element
          in: query
          schema:
            $ref: "#/components/schemas/Element"
        - $ref: "#/components/parameters/WeaponType"
      responses:
        "200":
          description: Cursor-paginated characters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CharacterSummary"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /weapons:
    get:
      operationId: listGenshinWeapons
      summary: Search and filter weapons from the active release.
      security: []
      parameters:
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Rarity"
        - $ref: "#/components/parameters/WeaponType"
      responses:
        "200":
          description: Cursor-paginated weapons.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WeaponSummary"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /characters/{slug}:
    get:
      operationId: getGenshinCharacter
      summary: Read one character with stats, level costs, talents and constellations.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Localized character profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: Character slug was not found in the active release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /weapons/{slug}:
    get:
      operationId: getGenshinWeapon
      summary: Read one weapon with progression, refinements and ascension costs.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Localized weapon profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaponDetail"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: Weapon slug was not found in the active release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /artifact-sets:
    get:
      operationId: listGenshinArtifactSets
      summary: Search and filter artifact sets from the active release.
      security: []
      parameters:
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Rarity"
      responses:
        "200":
          description: Cursor-paginated artifact sets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ArtifactSetSummary"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /artifact-sets/{slug}:
    get:
      operationId: getGenshinArtifactSet
      summary: Read one artifact set with effects, pieces and acquisition sources.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Localized artifact set profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSetDetail"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: Artifact set slug was not found in the active release.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /talents:
    get:
      operationId: listGenshinTalents
      summary: Search character talents from the active release.
      security: []
      parameters:
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated character talents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TalentSummary"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /content/{category}:
    get:
      operationId: listGenshinContent
      summary: Read any complete genshin-db source category.
      security: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]{1,64}$'
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated complete source-preserving records.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ContentSummary"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  parameters:
    Locale:
      name: locale
      in: query
      description: Requested localization. English is used only as an explicit field-level fallback.
      schema:
        $ref: "#/components/schemas/Locale"
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      description: Opaque nextCursor from the previous response.
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    Rarity:
      name: rarity
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 5
    WeaponType:
      name: weaponType
      in: query
      schema:
        $ref: "#/components/schemas/WeaponType"
  responses:
    InvalidQuery:
      description: One or more query parameters are invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CatalogUnavailable:
      description: PostgreSQL catalog data could not be read.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The public API rate limit was exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Locale:
      type: string
      enum: [en_US, ru_RU]
      default: en_US
    Element:
      type: string
      enum: [none, anemo, geo, electro, dendro, hydro, pyro, cryo]
    WeaponType:
      type: string
      enum: [sword, claymore, polearm, bow, catalyst]
    APIIndex:
      type: object
      required: [version, status, resources, locales]
      properties:
        version:
          const: v1
        status:
          type: string
        resources:
          type: object
          required: [characters, weapons, artifactSets, talents, content]
          properties:
            characters: { type: string }
            weapons: { type: string }
            artifactSets: { type: string }
            talents: { type: string }
            content: { type: string }
        locales:
          type: array
          items:
            $ref: "#/components/schemas/Locale"
    CatalogStatus:
      type: object
      required: [ready, characters, weapons, artifactSets, talents, contentEntries, contentByCategory, mediaAssets, locales]
      properties:
        ready: { type: boolean }
        releaseId: { type: string, format: uuid }
        sourceRevision: { type: string }
        gameVersion: { type: string }
        publishedAt: { type: string, format: date-time }
        characters: { type: integer, format: int64, minimum: 0 }
        weapons: { type: integer, format: int64, minimum: 0 }
        artifactSets: { type: integer, format: int64, minimum: 0 }
        talents: { type: integer, format: int64, minimum: 0 }
        contentEntries: { type: integer, format: int64, minimum: 0 }
        contentByCategory:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        mediaAssets: { type: integer, format: int64, minimum: 0 }
        locales:
          type: array
          items:
            $ref: "#/components/schemas/Locale"
    CursorPage:
      type: object
      required: [pagination]
      properties:
        pagination:
          type: object
          required: [hasMore, limit]
          properties:
            nextCursor: { type: string }
            hasMore: { type: boolean }
            limit: { type: integer, minimum: 1, maximum: 100 }
    CharacterSummary:
      type: object
      required: [id, externalId, slug, name, title, rarity, element, weaponType, region, locale, localeFallback, talentCount]
      properties:
        id: { type: integer, format: int64 }
        externalId: { type: integer, format: int32 }
        slug: { type: string }
        name: { type: string }
        title: { type: string }
        rarity: { type: integer, minimum: 4, maximum: 5 }
        element: { $ref: "#/components/schemas/Element" }
        weaponType: { $ref: "#/components/schemas/WeaponType" }
        region: { type: string }
        iconUrl: { type: [string, "null"] }
        portraitUrl: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
        talentCount: { type: integer, format: int64, minimum: 0 }
    CharacterDetail:
      allOf:
        - $ref: "#/components/schemas/CharacterSummary"
        - type: object
          required: [description, stats, ascensionCosts, levelingCosts, talents, constellations]
          properties:
            description: { type: string }
            stats:
              oneOf:
                - $ref: "#/components/schemas/CharacterStats"
                - type: "null"
            ascensionCosts:
              type: array
              items: { $ref: "#/components/schemas/UpgradeCostStage" }
            levelingCosts:
              $ref: "#/components/schemas/LevelingCosts"
            talents:
              type: array
              items: { $ref: "#/components/schemas/TalentSummary" }
            constellations:
              type: array
              items: { $ref: "#/components/schemas/ConstellationSummary" }
    CharacterStats:
      type: object
      required: [base, curve, promotion, specialized]
      properties:
        base:
          type: object
          required: [hp, attack, defense, critRate, critDamage]
          properties:
            hp: { type: number }
            attack: { type: number }
            defense: { type: number }
            critRate: { type: number }
            critDamage: { type: number }
        curve:
          type: object
          additionalProperties: { type: string }
        promotion:
          type: array
          items: { $ref: "#/components/schemas/CharacterPromotion" }
        specialized: { type: string }
    CharacterPromotion:
      type: object
      required: [hp, attack, defense, maxLevel, specialized]
      properties:
        hp: { type: number }
        attack: { type: number }
        defense: { type: number }
        maxLevel: { type: integer, minimum: 1, maximum: 90 }
        specialized: { type: number }
    ConstellationSummary:
      type: object
      required: [id, characterSlug, externalKey, position, name, description, locale, localeFallback]
      properties:
        id: { type: integer, format: int64 }
        characterSlug: { type: string }
        externalKey: { type: string }
        position: { type: integer, minimum: 1, maximum: 6 }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
    WeaponSummary:
      type: object
      required: [id, externalId, slug, name, rarity, weaponType, secondaryStat, locale, localeFallback]
      properties:
        id: { type: integer, format: int64 }
        externalId: { type: integer, format: int32 }
        slug: { type: string }
        name: { type: string }
        rarity: { type: integer, minimum: 1, maximum: 5 }
        weaponType: { $ref: "#/components/schemas/WeaponType" }
        baseAttack: { type: [number, "null"] }
        secondaryStat: { type: string }
        secondaryStatValue: { type: [number, "null"] }
        iconUrl: { type: [string, "null"] }
        description: { type: string }
        passiveName: { type: string }
        passiveDescription: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
    WeaponDetail:
      allOf:
        - $ref: "#/components/schemas/WeaponSummary"
        - type: object
          required: [stats, refinements, ascensionCosts, levelingCosts]
          properties:
            stats:
              oneOf:
                - $ref: "#/components/schemas/WeaponStats"
                - type: "null"
            refinements:
              type: array
              items:
                $ref: "#/components/schemas/WeaponRefinement"
            ascensionCosts:
              type: array
              items:
                $ref: "#/components/schemas/UpgradeCostStage"
            levelingCosts:
              $ref: "#/components/schemas/LevelingCosts"
    WeaponStats:
      type: object
      required: [base, curve, promotion, specialized]
      properties:
        base:
          type: object
          required: [attack, specialized]
          properties:
            attack: { type: number }
            specialized: { type: number }
        curve:
          type: object
          additionalProperties: { type: string }
        promotion:
          type: array
          items:
            $ref: "#/components/schemas/WeaponPromotion"
        specialized: { type: string }
    WeaponPromotion:
      type: object
      required: [attack, maxLevel]
      properties:
        attack: { type: number }
        maxLevel: { type: integer, minimum: 1, maximum: 90 }
    WeaponRefinement:
      type: object
      required: [level, values, description]
      properties:
        level: { type: integer, minimum: 1, maximum: 5 }
        values:
          type: array
          items: { type: string }
        description: { type: string }
    UpgradeCostStage:
      type: object
      required: [key, stage, items]
      properties:
        key: { type: string }
        stage: { type: integer, minimum: 1, maximum: 6 }
        maxLevel: { type: integer, minimum: 1, maximum: 90 }
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpgradeCostItem"
    UpgradeCostItem:
      type: object
      required: [id, name, count]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        count: { type: integer, minimum: 1 }
        iconUrl: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
    LevelingCosts:
      type: object
      required: [levels, materials]
      properties:
        levels:
          type: array
          description: Exact EXP and Mora requirement for every level in the active game version.
          items: { $ref: "#/components/schemas/LevelProgressionCost" }
        materials:
          type: array
          description: Canonical material composition for each ascension range.
          items: { $ref: "#/components/schemas/LevelMaterialCost" }
    LevelProgressionCost:
      type: object
      required: [level, nextLevel, expRequired, totalExp, moraCost]
      properties:
        level: { type: integer, minimum: 1, maximum: 90 }
        nextLevel: { type: [integer, "null"], minimum: 2, maximum: 90 }
        expRequired: { type: integer, format: int64, minimum: 0 }
        totalExp: { type: integer, format: int64, minimum: 0 }
        moraCost: { type: integer, format: int64, minimum: 0 }
    LevelMaterialCost:
      type: object
      required: [fromLevel, toLevel, materialKey, materialId, name, count, experiencePerItem, experienceProvided, wastedExperience, moraCost, locale, localeFallback]
      properties:
        fromLevel: { type: integer, minimum: 1, maximum: 89 }
        toLevel: { type: integer, minimum: 2, maximum: 90 }
        materialKey: { type: string }
        materialId: { type: [integer, "null"], format: int64 }
        name: { type: string }
        count: { type: integer, format: int64, minimum: 1 }
        experiencePerItem: { type: integer, format: int64, minimum: 1 }
        experienceProvided: { type: integer, format: int64, minimum: 1 }
        wastedExperience: { type: integer, format: int64, minimum: 0 }
        moraCost: { type: integer, format: int64, minimum: 0 }
        iconUrl: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
    ArtifactSetSummary:
      type: object
      required: [id, externalId, slug, name, minRarity, maxRarity, twoPieceBonus, fourPieceBonus, locale, localeFallback, pieceCount]
      properties:
        id: { type: integer, format: int64 }
        externalId: { type: integer, format: int32 }
        slug: { type: string }
        name: { type: string }
        minRarity: { type: integer, minimum: 1, maximum: 5 }
        maxRarity: { type: integer, minimum: 1, maximum: 5 }
        twoPieceBonus: { type: string }
        fourPieceBonus: { type: string }
        iconUrl: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
        pieceCount: { type: integer, format: int64, minimum: 0 }
    ArtifactSetDetail:
      allOf:
        - $ref: "#/components/schemas/ArtifactSetSummary"
        - type: object
          required: [pieces, sources]
          properties:
            pieces:
              type: array
              items: { $ref: "#/components/schemas/ArtifactPieceSummary" }
            sources:
              type: array
              items: { $ref: "#/components/schemas/ArtifactSourceSummary" }
    ArtifactPieceSummary:
      type: object
      required: [id, slot, name, description, locale, localeFallback]
      properties:
        id: { type: integer, format: int64 }
        slot: { type: string, enum: [flower, plume, sands, goblet, circlet] }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
    ArtifactSourceSummary:
      type: object
      required: [slug, name, region, entranceName, unlockRank, recommendedLevel, sourceKind]
      properties:
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        entranceName: { type: string }
        unlockRank: { type: integer, minimum: 0 }
        recommendedLevel: { type: integer, minimum: 0 }
        sourceKind: { type: string, enum: [domain, world_boss, artifact_strongbox] }
        note: { type: string }
    ContentSummary:
      type: object
      required: [id, category, slug, name, description, media, sourcePayload, localizedPayload, locale, localeFallback]
      properties:
        id: { type: integer, format: int64 }
        externalId: { type: [integer, "null"], format: int64 }
        category: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: [string, "null"] }
        media:
          type: array
          items:
            type: object
            required: [role, filename, url]
            properties:
              role: { type: string }
              filename: { type: string }
              url: { type: [string, "null"] }
        sourcePayload: { type: object, additionalProperties: true }
        localizedPayload: { type: object, additionalProperties: true }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
    TalentSummary:
      type: object
      required: [id, characterSlug, characterName, externalKey, kind, displayOrder, name, description, locale, localeFallback]
      properties:
        id: { type: integer, format: int64 }
        characterSlug: { type: string }
        characterName: { type: string }
        externalKey: { type: string }
        kind: { type: string, enum: [normal_attack, elemental_skill, elemental_burst, alternate_sprint, passive] }
        displayOrder: { type: integer }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        localeFallback: { type: boolean }
        upgradeCosts:
          type: array
          items: { $ref: "#/components/schemas/TalentLevelCost" }
    TalentLevelCost:
      type: object
      required: [level, items]
      properties:
        level: { type: integer, minimum: 2, maximum: 10 }
        items:
          type: array
          items: { $ref: "#/components/schemas/UpgradeCostItem" }
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
