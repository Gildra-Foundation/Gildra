services:
  postgres:
    image: postgres@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    security_opt:
      - no-new-privileges:true

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:80a5d78b746f7b70631908b3aff2249002e174c3f0520342d7c1f1abc0cd6751
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    security_opt:
      - no-new-privileges:true

  api:
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/livez"]
      interval: 10s
      timeout: 3s
      retries: 12
      # Goose may need several minutes for an intentionally heavyweight
      # migration (for example rebuilding a public read model).  Do not mark
      # a container unhealthy before its migration transaction can finish.
      start_period: 5m

  catalog-pipeline:
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  catalog-backup:
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true

  catalog-media-cache:
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  genshin-import:
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  lol-import:
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Next.js ISR/fetch cache must remain writable even though the image is
      # immutable. Keep it bounded and ephemeral so a stale cache can never
      # consume the host filesystem.
      - /app/.next/cache:size=128m,mode=0750,uid=1001,gid=1001
      # Optimized images get their own tmpfs: when the fetch cache filled the
      # shared mount, Next cached image variants as empty files.
      - /app/.next/cache/images:size=512m,mode=0750,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    # One web writer; private optimizer checkpoints survive container replacement.
    # Provision the host directory as UID/GID1001 before starting this service.
    volumes:
      - type: bind
        source: ${AUCTION_STATE_HOST_PATH:-/var/lib/gildra/auction-state}
        target: /var/lib/gildra/auction-state
        bind:
          create_host_path: false
    # Shared CMS (/wow/articles, signed cache refresh) and the first-party Plausible
    # tracker; read by web builds that include the shared-cms integration.
    environment:
      CMS_SITE_SLUG: gildra
      CMS_PUBLIC_URL: https://cms.gildra.net
      CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET_GILDRA:-}
      SITE_PUBLIC_ORIGIN: https://gildra.net
      PLAUSIBLE_SCRIPT_URL: https://gildra.net/stats/js/script.js
      PLAUSIBLE_API_URL: /stats/api/event
      PLAUSIBLE_SITE_DOMAIN: gildra.net
      GILDRA_AUCTION_STATE_DIR: /var/lib/gildra/auction-state
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');if(process.env.GILDRA_AUCTION_STATE_DIR)fs.accessSync(process.env.GILDRA_AUCTION_STATE_DIR,fs.constants.R_OK|fs.constants.W_OK);fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Shared CMS for gildra.net + riftden.com (shared-cms-20261011): admin at cms.gildra.net.
  cms:
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=0750,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    environment: &cms-shared-env
      CMS_JOBS_AUTORUN: "false"
      CMS_REVALIDATE_SECRET_GILDRA: ${CMS_REVALIDATE_SECRET_GILDRA:-}
      CMS_REVALIDATE_SECRET_RIFTDEN: ${CMS_REVALIDATE_SECRET_RIFTDEN:-}
      PLAUSIBLE_URL: http://plausible:8000
      PLAUSIBLE_API_KEY: ${PLAUSIBLE_API_KEY:-}
      # Sites whose frontend renders draft previews itself (/preview, /cms-preview).
      CMS_SITE_PREVIEW: ${CMS_SITE_PREVIEW:-}
      # Reader e-mail stays off until the host mail relay is fully live (PTR).
      EMAIL_TRANSPORT: disabled
      EMAIL_FROM_NAME: Gildra Network
    networks:
      default: {}
      content:
        aliases: [cms]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/admin').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # The only jobs runner: scheduled publishing and signed cache invalidation of the sites.
  cms-jobs:
    image: ${CMS_JOBS_IMAGE:-gildra-cms-jobs:shared-cms-20261011}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *cms-shared-env
      PAYLOAD_DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra_cms?sslmode=disable
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_URL: https://cms.gildra.net
      CMS_JOBS_INTERVAL_SECONDS: "30"
    networks:
      default: {}
      content: {}
    depends_on:
      cms: { condition: service_healthy }

  rotation-sim-worker:
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image ships bash but no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  scraper:
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

  scraper-worker:
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  # Shared with Plausible and riftden (created once: docker network create gildra_content).
  content:
    name: gildra_content
    external: true
