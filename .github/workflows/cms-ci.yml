name: CMS CI

on:
  pull_request:
    paths: ["cms/**", ".github/workflows/cms-ci.yml"]
  push:
    branches: [master, "release/**"]
    paths: ["cms/**", ".github/workflows/cms-ci.yml"]

permissions:
  contents: read

concurrency:
  group: cms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: payload_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests refuse anything that is not a local payload_*test* database.
      PAYLOAD_DATABASE_URL: postgres://payload:ci@localhost:5432/payload_ci_test
      PAYLOAD_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
