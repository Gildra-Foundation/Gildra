name: Repair published WoW catalog

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to repair: retail, classic, classic-era or hardcore'
        required: true
        default: retail
        type: choice
        options:
          - retail
          - classic
          - classic-era
          - hardcore
      build_version:
        description: 'Edition build to re-import (for example 12.1.0.69497)'
        required: true
        type: string
      confirm_repair:
        description: 'I understand this is a full, several-hour same-build import'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  repair:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate repair confirmation and build version
        env:
          EDITION: ${{ inputs.edition }}
          BUILD_VERSION: ${{ inputs.build_version }}
          CONFIRM_REPAIR: ${{ inputs.confirm_repair }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_REPAIR" = true || {
            echo 'The repair must be explicitly confirmed.' >&2
            exit 1
          }
          case "$EDITION" in
            retail|classic|classic-era|hardcore) ;;
            *)
              echo 'edition must be retail, classic, classic-era, or hardcore.' >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$BUILD_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo 'build_version must contain exactly four numeric components.' >&2
            exit 1
          }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run repair on OVHcloud
        env:
          EDITION: ${{ inputs.edition }}
          BUILD_VERSION: ${{ inputs.build_version }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          # BUILD_VERSION was validated above and contains only digits/dots.
          # EDITION is a fixed choice input validated above. Passing both as
          # environment values keeps shell interpolation safe.
          ssh "$OVH_USER@$OVH_HOST" \
            "sudo env CATALOG_REPAIR_EDITION='$EDITION' CATALOG_REPAIR_BUILD_VERSION='$BUILD_VERSION' /opt/gildra/infra/deploy/run-catalog-repair.sh"

      - name: Verify production after repair
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://api.gildra.net/livez >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://api.gildra.net/readyz >/dev/null
          catalog_status="$(curl --silent --show-error --retry 6 --retry-delay 5 --max-time 15 --output /dev/null --write-out '%{http_code}' 'https://api.gildra.net/v1/library/datasets?product=wow&locale=en_US')"
          test "$catalog_status" = 401
          for edition in retail classic classic-era hardcore; do
            prefixed_catalog_status="$(curl --silent --show-error --retry 6 --retry-delay 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "https://api.gildra.net/world-of-warcraft/$edition/v1/library/datasets?locale=en_US")"
            test "$prefixed_catalog_status" = 401
          done
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://api.gildra.net/library/items >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://api.gildra.net/ru/library/items >/dev/null
