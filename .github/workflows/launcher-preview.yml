name: Verify released desktop update
on:
  push:
    branches: [desktop/launcher-preview-18]
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: verify-update.ps1
          sparse-checkout-cone-mode: false
      - shell: pwsh
        run: ./verify-update.ps1 -Version 22
