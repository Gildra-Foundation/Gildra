name: Candidate Images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: candidate-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: .
            file: ./Dockerfile
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
          - name: scraper
            context: ./scraper
            file: ./scraper/Dockerfile
          - name: rotation-sim-worker
            context: .
            file: ./infra/simc/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/gildra-foundation/gildra-${{ matrix.name }}
          tags: type=sha,format=long,prefix=
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          outputs: type=image,compression=zstd,compression-level=3
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record immutable image
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/digests/revision"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
