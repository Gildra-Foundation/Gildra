name: Deploy OVHcloud

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            context: .
            file: ./Dockerfile
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
          - name: cms
            context: ./cms
            file: ./cms/Dockerfile
          - name: scraper
            context: ./scraper
            file: ./scraper/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/gildra-foundation/gildra-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image digests
        id: images
        env:
          IMAGE_PREFIX: ghcr.io/gildra-foundation/gildra
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for name in web api cms scraper; do
            ref="$IMAGE_PREFIX-$name:$IMAGE_SHA"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            key="$(printf '%s_IMAGE' "$name" | tr '[:lower:]' '[:upper:]')"
            printf '%s=%s\n' "$key" "$IMAGE_PREFIX-$name@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment configuration
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          tar -czf - compose.yml compose.prod.yml compose.runtime.yml infra/nginx infra/postgres | ssh "$OVH_USER@$OVH_HOST" 'sudo install -d -m 700 /opt/gildra && sudo tar --no-same-owner -xzf - -C /opt/gildra && sudo chown -R root:root /opt/gildra'
      - name: Deploy immutable images
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          WEB_IMAGE: ${{ steps.images.outputs.WEB_IMAGE }}
          API_IMAGE: ${{ steps.images.outputs.API_IMAGE }}
          CMS_IMAGE: ${{ steps.images.outputs.CMS_IMAGE }}
          SCRAPER_IMAGE: ${{ steps.images.outputs.SCRAPER_IMAGE }}
        run: |
          ssh "$OVH_USER@$OVH_HOST" \
            "sudo env WEB_IMAGE='$WEB_IMAGE' API_IMAGE='$API_IMAGE' CMS_IMAGE='$CMS_IMAGE' SCRAPER_IMAGE='$SCRAPER_IMAGE' sh -s" <<'REMOTE'
          set -eu
          cd /opt/gildra
          if [ -f current-release.env ]; then
            cp -f current-release.env previous-release.env
          fi
          docker compose --env-file .env -f compose.yml -f compose.prod.yml -f compose.runtime.yml pull
          docker compose --env-file .env -f compose.yml -f compose.prod.yml -f compose.runtime.yml up -d --no-build --remove-orphans --wait --wait-timeout 240
          curl --fail --silent --show-error --insecure --retry 6 --retry-delay 5 --max-time 15 --resolve api.gildra.net:443:127.0.0.1 https://api.gildra.net/livez >/dev/null
          curl --fail --silent --show-error --insecure --retry 6 --retry-delay 5 --max-time 15 --resolve api.gildra.net:443:127.0.0.1 https://api.gildra.net/readyz >/dev/null
          curl --fail --silent --show-error --insecure --retry 6 --retry-delay 5 --max-time 15 --resolve gildra.net:443:127.0.0.1 https://gildra.net/database >/dev/null
          curl --fail --silent --show-error --insecure --retry 6 --retry-delay 5 --max-time 15 --resolve gildra.net:443:127.0.0.1 https://gildra.net/ru/database >/dev/null
          umask 077
          {
            printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE"
            printf 'API_IMAGE=%s\n' "$API_IMAGE"
            printf 'CMS_IMAGE=%s\n' "$CMS_IMAGE"
            printf 'SCRAPER_IMAGE=%s\n' "$SCRAPER_IMAGE"
          } > current-release.env.tmp
          mv -f current-release.env.tmp current-release.env
          REMOTE
      - name: Verify public production paths
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://api.gildra.net/livez >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://api.gildra.net/readyz >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://gildra.net/database >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://gildra.net/ru/database >/dev/null
