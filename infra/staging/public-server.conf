# Append only after acquiring the live nginx configuration lock and backing up
# the current file. This block reuses the existing wildcard origin certificate.
server {
    listen 80;
    server_name staging.gildra.net;
    return 301 https://staging.gildra.net$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name staging.gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mvp_upstream http://mvp-staging-edge:8080;
    # Official Cloudflare GET /ips, 2026-10-19, etag 38f79d050aa027e3be3865e495dcc9bc.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;
    location / {
        proxy_pass $mvp_upstream;
        proxy_set_header Host staging.gildra.net;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Host staging.gildra.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
