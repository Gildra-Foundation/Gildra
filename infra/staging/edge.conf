worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        client_max_body_size 1m;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # No API response, session or HTML should be cached at the public edge.
        add_header Cache-Control "private, no-store" always;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web_upstream http://web-staging:3000;
        location / {
            proxy_pass $web_upstream;
            proxy_hide_header Cache-Control;
            proxy_set_header Host staging.gildra.net;
            proxy_set_header X-Forwarded-Host staging.gildra.net;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_read_timeout 60s;
        }
    }
}
