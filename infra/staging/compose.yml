# Staging copy of gildra.net (roadmap 90): the release candidate's web image on
# the production host, reading the production API. A separate compose
# project, so a full release's `--remove-orphans` never touches it.
#   UI/QA: http://127.0.0.1:3200 on the host (SSH tunnel from outside); once
#   staging.gildra.net has a DNS record, nginx serves it there behind basic auth.
# Deploy with infra/deploy/deploy-web-staging.sh <image>; promote the same image
# to production with the usual web deploy.
name: gildra-staging

services:
  web-staging:
    image: ${WEB_STAGING_IMAGE:?WEB_STAGING_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=0750,uid=1001,gid=1001
      - /app/.next/cache/images:size=256m,mode=0750,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    environment:
      GILDRA_STAGING: "1"
      API_INTERNAL_URL: http://api:8080
      CATALOG_ACCESS_MODE: public
      SITE_PUBLIC_ORIGIN: https://staging.gildra.net
      # No AUTH_SECRET: Battle.net callbacks point at production, so sign-in is
      # reported as not configured here.
      AUTH_URL: https://staging.gildra.net
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_WEB_DSN:-}
      SENTRY_DSN: ${SENTRY_WEB_DSN:-}
      SENTRY_ENVIRONMENT: staging
      SENTRY_TRACES_SAMPLE_RATE: "0"
      ROTATION_WORKER_URL: http://rotation-sim-worker:8080
      ROTATION_ALLOW_MVP_FALLBACK: "false"
    ports:
      - "127.0.0.1:3200:3000"
    networks:
      gildra:
        aliases: [web-staging]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  gildra:
    external: true
    name: gildra_default
