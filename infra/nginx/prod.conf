map $http_cf_connecting_ip $origin_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Product-scoped public API editions.  The edge prefix is authoritative and
# is translated into the existing catalog product slug before the request
# reaches the Go service.
map $catalog_edition $catalog_product {
    default     wow;
    retail      wow;
    classic     wow_classic;
    classic-era wow_classic_era;
    hardcore    wow_classic_hardcore;
}

map $catalog_base_edition $catalog_base_product {
    default     wow;
    retail      wow;
    classic     wow_classic;
    classic-era wow_classic_era;
    hardcore    wow_classic_hardcore;
}

limit_req_zone $origin_client_ip zone=analytics_ingest:10m rate=30r/s;
limit_req_zone $origin_client_ip zone=indexnow_submit:10m rate=5r/m;
limit_req_zone $origin_client_ip zone=public_api:10m rate=120r/s;
limit_req_zone $origin_client_ip zone=graphql_api:10m rate=30r/s;
limit_req_zone $origin_client_ip zone=admin_login:10m rate=10r/m;

server {
    listen 80;
    server_name gildra.net api.gildra.net;
    return 301 https://$host$request_uri;
}

# www is only an alias: one permanent hop to the canonical apex host, so search
# engines never see a second copy of the site (SEO audit 2026-10-13).
server {
    listen 80;
    server_name www.gildra.net;
    return 301 https://gildra.net$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://gildra.net$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    add_header Access-Control-Allow-Origin "https://gildra.net" always;
    add_header Vary "Origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
        proxy_pass http://web:3000/api-console;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(catalog|datasets|api|system)(/.*)?$ {
        rewrite ^/(.*)$ /api-console/$1 break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Genshin uses its own database and API namespace. Keep the API prefix
    # more specific than the web-panel route so it can never be rendered by
    # Next.js accidentally.
    location ^~ /genshin-impact/v1 {
        limit_req zone=public_api burst=240 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /genshin-impact/media/ {
        limit_req zone=public_api burst=240 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # League of Legends has an independent versioned API and local media
    # namespace. Keep these locations ahead of the web fallback so JSON and
    # images are never rendered by Next.js.
    location ^~ /league-of-legends/v1 {
        limit_req zone=public_api burst=240 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /league-of-legends/media/ {
        limit_req zone=public_api burst=240 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /league-of-legends {
        proxy_pass http://web:3000/league-of-legends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /league-of-legends/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /genshin-impact {
        proxy_pass http://web:3000/api-console/genshin-impact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /genshin-impact/ {
        rewrite ^/(.*)$ /api-console/$1 break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /favicon.ico {
        proxy_pass http://web:3000/icon.png;
        proxy_set_header Host $host;
    }

    location /_next/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/auth/login {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://api:8080/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/ {
        proxy_pass http://api:8080/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1 {
        proxy_pass http://api:8080/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Canonical product-scoped API bases.  The Go service still owns
    # authentication, rate limits and response semantics; nginx removes the
    # edition prefix and pins the corresponding product query parameter.
    # The explicit base location rewrites to /v1 (without a trailing slash),
    # matching the Go index route.  A generic proxy would preserve /v1/ and
    # return a misleading 404 before any catalog policy is evaluated.
    location ~ ^/world-of-warcraft/(?<catalog_base_edition>retail|classic|classic-era|hardcore)/v1/?$ {
        limit_req zone=public_api burst=240 nodelay;
        rewrite ^ /v1?product=$catalog_base_product&$args? break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/world-of-warcraft/(?<catalog_edition>retail|classic|classic-era|hardcore)/v1(?:/(?<catalog_suffix>.*))?$ {
        limit_req zone=public_api burst=240 nodelay;
        rewrite ^ /v1/$catalog_suffix?product=$catalog_product&$args? break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        limit_req zone=public_api burst=240 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /graphql {
        limit_req zone=graphql_api burst=60 nodelay;
        proxy_pass http://api:8080/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /livez {
        proxy_pass http://api:8080/livez;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }

    # Library pages are rendered by Next.js and perform an explicit session
    # check before calling the private catalog API. API, GraphQL and health
    # locations above remain more specific and continue to terminate at Go.
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    # /database and /library are public pages served by Next.js (the private
    # console redirects were retired with CATALOG_ACCESS_MODE=public).

    # Next.js route handlers also live under /api: Auth.js (Battle.net sign-in and
    # callback), the character workspace and simulations, Warcraft Logs, the
    # character model proxy and the platform routes. They must reach the web
    # service; every other /api/ path keeps terminating at the Go API below.
    # Simulations can run close to a minute, so allow a longer upstream read.
    location ^~ /api/auth/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/wow/ {
        proxy_pass http://web:3000;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/wow-model/ {
        proxy_pass http://web:3000;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        # Wowhead model binaries (.m2/.skin/.skel/.anim) arrive uncompressed and
        # Cloudflare does not compress application/octet-stream: gzip halves them
        # (m2 10.8 -> 4.6 MB, skel 18.8 -> 10.1 MB); JSON is left to Cloudflare brotli.
        # Next adds Vary: rsc, next-router-* to every response; model files do not vary.
        proxy_hide_header Vary;
        gzip on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types application/octet-stream;
    }
    location ^~ /api/platform/ {
        proxy_pass http://web:3000;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Catalog previews use the Next.js entity proxy, which preserves locale,
    # access checks and private/no-store responses from the catalog API.
    location ^~ /api/catalog/entities/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/v1/analytics/events {
        limit_req zone=analytics_ingest burst=60 nodelay;
        proxy_pass http://api:8080/v1/analytics/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/v1/indexnow {
        limit_req zone=indexnow_submit burst=2 nodelay;
        proxy_pass http://api:8080/v1/indexnow;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Plausible CE (self-hosted analytics, /opt/plausible), first-party: tracker
    # script and event ingest only; the dashboard is not public. The upstream is
    # resolved per request so nginx starts even while Plausible is down.
    location = /stats/js/script.js {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $plausible_upstream http://plausible:8000;
        proxy_pass $plausible_upstream/js/script.js;
        proxy_set_header Host $host;
    }

    location = /stats/js/script.exclusions.js {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $plausible_upstream http://plausible:8000;
        proxy_pass $plausible_upstream/js/script.exclusions.js;
        proxy_set_header Host $host;
    }
    location = /stats/api/event {
        limit_req zone=analytics_ingest burst=60 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $plausible_upstream http://plausible:8000;
        proxy_pass $plausible_upstream/api/event;
        proxy_set_header Host $host;
        proxy_set_header X-Plausible-IP $origin_client_ip;
        proxy_set_header X-Forwarded-For $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Standalone team mailbox: renewable ACME HTTP-01 validation only.
server {
    listen 80;
    server_name mail.gildra.net;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/mail-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

# Append only after acquiring the live nginx configuration lock and backing up
# the current file. This block reuses the existing wildcard origin certificate.
server {
    listen 80;
    server_name staging.gildra.net;
    return 301 https://staging.gildra.net$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name staging.gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mvp_upstream http://mvp-staging-edge:8080;
    # Official Cloudflare GET /ips, 2026-10-19, etag 38f79d050aa027e3be3865e495dcc9bc.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
