map $http_cf_connecting_ip $origin_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Product-scoped public API editions.  The edge prefix is authoritative and
# is translated into the existing catalog product slug before the request
# reaches the Go service.
map $catalog_edition $catalog_product {
    default     wow;
    retail      wow;
    classic     wow_classic;
    classic-era wow_classic_era;
    hardcore    wow_classic_hardcore;
}

limit_req_zone $origin_client_ip zone=analytics_ingest:10m rate=30r/s;
limit_req_zone $origin_client_ip zone=indexnow_submit:10m rate=5r/m;
limit_req_zone $origin_client_ip zone=public_api:10m rate=120r/s;
limit_req_zone $origin_client_ip zone=graphql_api:10m rate=30r/s;
limit_req_zone $origin_client_ip zone=admin_login:10m rate=10r/m;

server {
    listen 80;
    server_name gildra.net www.gildra.net cms.gildra.net api.gildra.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    add_header Access-Control-Allow-Origin "https://gildra.net" always;
    add_header Vary "Origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
        proxy_pass http://web:3000/api-console;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(catalog|datasets|api|system)(/.*)?$ {
        rewrite ^/(.*)$ /api-console/$1 break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Genshin uses its own database and API namespace. Keep the API prefix
    # more specific than the web-panel route so it can never be rendered by
    # Next.js accidentally.
    location ^~ /genshin-impact/v1 {
        limit_req zone=public_api burst=240 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /genshin-impact {
        proxy_pass http://web:3000/api-console/genshin-impact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /genshin-impact/ {
        rewrite ^/(.*)$ /api-console/$1 break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /favicon.ico {
        proxy_pass http://web:3000/icon.png;
        proxy_set_header Host $host;
    }

    location /_next/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/auth/login {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://api:8080/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/ {
        proxy_pass http://api:8080/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1 {
        proxy_pass http://api:8080/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Canonical product-scoped API bases.  The Go service still owns
    # authentication, rate limits and response semantics; nginx removes the
    # edition prefix and pins the corresponding product query parameter.
    location ~ ^/world-of-warcraft/(?<catalog_edition>retail|classic|classic-era|hardcore)/v1(?:/(?<catalog_suffix>.*))?$ {
        limit_req zone=public_api burst=240 nodelay;
        rewrite ^ /v1/$catalog_suffix?product=$catalog_product&$args break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        limit_req zone=public_api burst=240 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /graphql {
        limit_req zone=graphql_api burst=60 nodelay;
        proxy_pass http://api:8080/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /livez {
        proxy_pass http://api:8080/livez;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }

    # Library pages are rendered by Next.js and perform an explicit session
    # check before calling the private catalog API. API, GraphQL and health
    # locations above remain more specific and continue to terminate at Go.
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gildra.net www.gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    location ^~ /database {
        return 302 https://api.gildra.net/library;
    }
    location ^~ /library {
        return 302 https://api.gildra.net$request_uri;
    }
    location ^~ /ru/database {
        return 302 https://api.gildra.net/library;
    }
    location ^~ /ru/library {
        return 302 https://api.gildra.net$request_uri;
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/v1/analytics/events {
        limit_req zone=analytics_ingest burst=60 nodelay;
        proxy_pass http://api:8080/v1/analytics/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/v1/indexnow {
        limit_req zone=indexnow_submit burst=2 nodelay;
        proxy_pass http://api:8080/v1/indexnow;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cms.gildra.net;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location / {
        proxy_pass http://cms:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $origin_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
