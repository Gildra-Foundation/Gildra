map $catalog_edition $catalog_product {
    default     wow;
    retail      wow;
    classic     wow_classic;
    classic-era wow_classic_era;
    hardcore    wow_classic_hardcore;
}

map $catalog_base_edition $catalog_base_product {
    default     wow;
    retail      wow;
    classic     wow_classic;
    classic-era wow_classic_era;
    hardcore    wow_classic_hardcore;
}

server {
    listen 80;
    server_name gildra.net www.gildra.net localhost;
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep local development compatible with every product-scoped API URL.
    location ~ ^/world-of-warcraft/(?<catalog_base_edition>retail|classic|classic-era|hardcore)/v1/?$ {
        rewrite ^ /v1?product=$catalog_base_product&$args break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/world-of-warcraft/(?<catalog_edition>retail|classic|classic-era|hardcore)/v1(?:/(?<catalog_suffix>.*))?$ {
        rewrite ^ /v1/$catalog_suffix?product=$catalog_product&$args break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /genshin-impact/v1 {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /genshin-impact/media/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /league-of-legends/v1 {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /league-of-legends/media/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /genshin-impact {
        proxy_pass http://web:3000/api-console/genshin-impact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /genshin-impact/ {
        rewrite ^/(.*)$ /api-console/$1 break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name cms.gildra.net;
    client_max_body_size 25m;

    location / {
        proxy_pass http://cms:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
