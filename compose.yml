name: gildra

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: gildra
      POSTGRES_USER: gildra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gildra -d gildra"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.3-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: gildra
      CLICKHOUSE_USER: gildra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine3.23
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:-gildra-api:local}
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: gildra
      CLICKHOUSE_USER: gildra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      INDEXNOW_HOST: gildra.net
      SENTRY_DSN: ${SENTRY_GO_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      DATASET_WORKER_URL: http://scraper-worker:8081
      DATASET_WORKER_TIMEOUT: 25m
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-12h}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      scraper-worker: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:-gildra-web:local}
    build: .
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_INTERNAL_URL: http://api:8080
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      - api

  cms:
    image: ${CMS_IMAGE:-gildra-cms:local}
    build: ./cms
    restart: unless-stopped
    logging: *default-logging
    environment:
      PAYLOAD_DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra_cms?sslmode=disable
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_URL: https://cms.gildra.net
      PAYLOAD_DB_PUSH: ${PAYLOAD_DB_PUSH:-false}
    volumes:
      - cms_media:/app/media
    depends_on:
      postgres: { condition: service_healthy }

  scraper:
    profiles: ["scraping"]
    image: ${SCRAPER_IMAGE:-gildra-scraper:local}
    build: ./scraper
    logging: *default-logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRAPER_PROVIDER_ATTEMPTS: ${SCRAPER_PROVIDER_ATTEMPTS:-2}
      SCRAPE_DO_TOKEN: ${SCRAPE_DO_TOKEN:-}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_ZONE: ${BRIGHTDATA_ZONE:-}
      BRIGHTDATA_BROWSER_ZONE: ${BRIGHTDATA_BROWSER_ZONE:-}
      BRIGHTDATA_CPM_USD: ${BRIGHTDATA_CPM_USD:-}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      ZENROWS_BASE_CPM_USD: ${ZENROWS_BASE_CPM_USD:-}
      ZYTE_API_KEY: ${ZYTE_API_KEY:-}
      ZYTE_HTTP_MAX_USD: ${ZYTE_HTTP_MAX_USD:-}
      ZYTE_BROWSER_MAX_USD: ${ZYTE_BROWSER_MAX_USD:-}
      ZYTE_CAPTURE_MAX_USD: ${ZYTE_CAPTURE_MAX_USD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    volumes:
      - scraper_state:/app/state
      - ./scraper/reports:/app/reports

  scraper-worker:
    image: ${SCRAPER_IMAGE:-gildra-scraper:local}
    build: ./scraper
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["python", "-m", "parsers.wowhead_dataset_daemon"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRAPER_PROVIDER_ATTEMPTS: ${SCRAPER_PROVIDER_ATTEMPTS:-2}
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: gildra
      CLICKHOUSE_USER: gildra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SCRAPE_DO_TOKEN: ${SCRAPE_DO_TOKEN:-}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_ZONE: ${BRIGHTDATA_ZONE:-}
      BRIGHTDATA_BROWSER_ZONE: ${BRIGHTDATA_BROWSER_ZONE:-}
      BRIGHTDATA_CPM_USD: ${BRIGHTDATA_CPM_USD:-}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      ZENROWS_BASE_CPM_USD: ${ZENROWS_BASE_CPM_USD:-}
      ZYTE_API_KEY: ${ZYTE_API_KEY:-}
      ZYTE_HTTP_MAX_USD: ${ZYTE_HTTP_MAX_USD:-}
      ZYTE_BROWSER_MAX_USD: ${ZYTE_BROWSER_MAX_USD:-}
      ZYTE_CAPTURE_MAX_USD: ${ZYTE_CAPTURE_MAX_USD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - cms

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  cms_media:
  scraper_state:
