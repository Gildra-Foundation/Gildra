name: gildra

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    # Keep enough POSIX shared memory for the catalog quality gates and
    # enrichment projections. The Docker default (64 MiB) can make otherwise
    # read-only joins fail with "No space left on device".
    shm_size: "256m"
    environment:
      POSTGRES_DB: gildra
      POSTGRES_USER: gildra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gildra -d gildra"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: gildra
      CLICKHOUSE_USER: gildra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:-gildra-api:local}
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: gildra
      CLICKHOUSE_USER: gildra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      INDEXNOW_HOST: gildra.net
      SENTRY_DSN: ${SENTRY_GO_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      CATALOG_PUBLICATION_MODE: ${CATALOG_PUBLICATION_MODE:-enforce}
      CATALOG_PUBLICATION_ENVIRONMENT: ${CATALOG_PUBLICATION_ENVIRONMENT:-production}
      CATALOG_ACCESS_MODE: ${CATALOG_ACCESS_MODE:-public}
      # The current deployment keeps its verified backup on this OVH host.
      # Operators can opt into an off-host policy explicitly once remote
      # storage is configured; do not make R2/S3 a hidden prerequisite.
      CATALOG_RECOVERY_POLICY: ${CATALOG_RECOVERY_POLICY:-verified_same_host}
      CATALOG_MEDIA_DIRECTORY: /var/lib/gildra/catalog-media
      DATASET_WORKER_URL: http://scraper-worker:8081
      DATASET_WORKER_TIMEOUT: 25m
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-12h}
      BATTLENET_CLIENT_ID: ${BATTLENET_CLIENT_ID:-}
      BATTLENET_CLIENT_SECRET: ${BATTLENET_CLIENT_SECRET:-}
      BATTLENET_BUILD_NUMBER: ${BATTLENET_BUILD_NUMBER:-}
      BATTLENET_BUILD_VERSION: ${BATTLENET_BUILD_VERSION:-}
    volumes:
      - catalog_media:/var/lib/gildra/catalog-media:ro
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      scraper-worker: { condition: service_healthy }

  # One-off catalog pipeline worker (imports, audit, publication).  It shares
  # the api image and environment but is NOT an HTTP service: no healthcheck,
  # no restart policy, so `compose run` containers are never reported as
  # unhealthy api instances.
  catalog-pipeline:
    profiles: ["operations"]
    image: ${API_IMAGE:-gildra-api:local}
    build: ./backend
    entrypoint: ["catalog-pipeline"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: gildra
      CLICKHOUSE_USER: gildra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      INDEXNOW_HOST: gildra.net
      SENTRY_DSN: ${SENTRY_GO_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      CATALOG_PUBLICATION_MODE: ${CATALOG_PUBLICATION_MODE:-enforce}
      CATALOG_PUBLICATION_ENVIRONMENT: ${CATALOG_PUBLICATION_ENVIRONMENT:-production}
      CATALOG_ACCESS_MODE: ${CATALOG_ACCESS_MODE:-public}
      # The current deployment keeps its verified backup on this OVH host.
      # Operators can opt into an off-host policy explicitly once remote
      # storage is configured; do not make R2/S3 a hidden prerequisite.
      CATALOG_RECOVERY_POLICY: ${CATALOG_RECOVERY_POLICY:-verified_same_host}
      CATALOG_MEDIA_DIRECTORY: /var/lib/gildra/catalog-media
      DATASET_WORKER_URL: http://scraper-worker:8081
      DATASET_WORKER_TIMEOUT: 25m
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-12h}
      BATTLENET_CLIENT_ID: ${BATTLENET_CLIENT_ID:-}
      BATTLENET_CLIENT_SECRET: ${BATTLENET_CLIENT_SECRET:-}
      BATTLENET_BUILD_NUMBER: ${BATTLENET_BUILD_NUMBER:-}
      BATTLENET_BUILD_VERSION: ${BATTLENET_BUILD_VERSION:-}
    volumes:
      - catalog_media:/var/lib/gildra/catalog-media:ro
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }

  catalog-backup:
    profiles: ["operations"]
    image: ${API_IMAGE:-gildra-api:local}
    build: ./backend
    entrypoint: ["catalog-backup"]
    command:
      - -product
      - ${CATALOG_BACKUP_PRODUCT:-wow}
      - -object-prefix
      - ${CATALOG_BACKUP_OBJECT_PREFIX:-catalog-backups}
      - -temp-directory
      - ${CATALOG_BACKUP_TEMP_DIRECTORY:-/var/lib/gildra/catalog-backups}
      - -timeout
      - ${CATALOG_BACKUP_TIMEOUT:-2h}
    environment:
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CATALOG_BACKUP_RESTORE_DATABASE_URL: ${CATALOG_BACKUP_RESTORE_DATABASE_URL:-}
      CATALOG_BACKUP_LOCAL_DIRECTORY: ${CATALOG_BACKUP_LOCAL_DIRECTORY:-/var/lib/gildra/catalog-backups}
      CATALOG_BACKUP_S3_ENDPOINT: ${CATALOG_BACKUP_S3_ENDPOINT:-}
      CATALOG_BACKUP_S3_REGION: ${CATALOG_BACKUP_S3_REGION:-auto}
      CATALOG_BACKUP_S3_BUCKET: ${CATALOG_BACKUP_S3_BUCKET:-}
      CATALOG_BACKUP_S3_ACCESS_KEY_ID: ${CATALOG_BACKUP_S3_ACCESS_KEY_ID:-}
      CATALOG_BACKUP_S3_SECRET_ACCESS_KEY: ${CATALOG_BACKUP_S3_SECRET_ACCESS_KEY:-}
      CATALOG_BACKUP_S3_PATH_STYLE: ${CATALOG_BACKUP_S3_PATH_STYLE:-true}
      CATALOG_BACKUP_URI_SCHEME: ${CATALOG_BACKUP_URI_SCHEME:-r2}
      CATALOG_BACKUP_AGE_RECIPIENT: ${CATALOG_BACKUP_AGE_RECIPIENT:-}
      CATALOG_BACKUP_AGE_IDENTITY: ${CATALOG_BACKUP_AGE_IDENTITY:-}
      CATALOG_BACKUP_SIGNING_KEY: ${CATALOG_BACKUP_SIGNING_KEY:-}
      CATALOG_MEDIA_DIRECTORY: /var/lib/gildra/catalog-media
    volumes:
      - catalog_media:/var/lib/gildra/catalog-media:ro
      - catalog_backups:/var/lib/gildra/catalog-backups
    depends_on:
      postgres: { condition: service_healthy }

  catalog-media-cache:
    profiles: ["operations"]
    image: ${API_IMAGE:-gildra-api:local}
    build: ./backend
    entrypoint: ["catalog-media-cache"]
    command:
      - -environment
      - ${CATALOG_PUBLICATION_ENVIRONMENT:-production}
      - -limit
      - "100"
    environment:
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CATALOG_MEDIA_DIRECTORY: /var/lib/gildra/catalog-media
      CATALOG_MEDIA_PUBLIC_BASE_URL: ${CATALOG_MEDIA_PUBLIC_BASE_URL:-https://api.gildra.net}
      CATALOG_PUBLICATION_ENVIRONMENT: ${CATALOG_PUBLICATION_ENVIRONMENT:-production}
      CATALOG_ACCESS_MODE: ${CATALOG_ACCESS_MODE:-public}
    volumes:
      - catalog_media:/var/lib/gildra/catalog-media
    depends_on:
      postgres: { condition: service_healthy }

  genshin-import:
    profiles: ["operations"]
    image: ${API_IMAGE:-gildra-api:local}
    build: ./backend
    entrypoint: ["genshin-import"]
    command:
      - -source-directory
      - /var/lib/gildra/genshin-source
      - -supplemental-directory
      - /var/lib/gildra/genshin-supplemental
      - -source-revision
      - ${GENSHIN_SOURCE_REVISION:-}
      - -game-version
      - ${GENSHIN_GAME_VERSION:-}
      - -media-directory
      - /var/lib/gildra/catalog-media
      - -alternate-media-directory
      - /var/lib/gildra/genshin-alt-media
      - -alternate-media-base-url
      - ${GENSHIN_ALTERNATE_MEDIA_BASE_URL:-https://raw.githubusercontent.com/PathOfGenshin/resources/015a2493b5672b28576ab78ffbcffde2ea0c9844/resources/gi/Sprite}
      - -media-workers
      - ${GENSHIN_MEDIA_WORKERS:-12}
    environment:
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CATALOG_MEDIA_DIRECTORY: /var/lib/gildra/catalog-media
    volumes:
      - catalog_media:/var/lib/gildra/catalog-media
      - ${GENSHIN_SOURCE_DIRECTORY:-./.artifacts/genshin-db-source}:/var/lib/gildra/genshin-source:ro
      - ${GENSHIN_SUPPLEMENTAL_DIRECTORY:-./.artifacts/genshin-supplemental}:/var/lib/gildra/genshin-supplemental:ro
      - ${GENSHIN_ALTERNATE_MEDIA_DIRECTORY:-./.artifacts/genshin-alt-media}:/var/lib/gildra/genshin-alt-media:ro
    depends_on:
      postgres: { condition: service_healthy }

  lol-import:
    profiles: ["operations"]
    image: ${API_IMAGE:-gildra-api:local}
    build: ./backend
    user: "65532:65532"
    entrypoint: ["lol-import"]
    command:
      - -version
      - ${LOL_DDRAGON_VERSION:-latest}
      - -media-directory
      - /var/lib/gildra/catalog-media
      - -workers
      - ${LOL_IMPORT_WORKERS:-12}
    environment:
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CATALOG_MEDIA_DIRECTORY: /var/lib/gildra/catalog-media
    volumes:
      - catalog_media:/var/lib/gildra/catalog-media
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:-gildra-web:local}
    build: .
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      CATALOG_ACCESS_MODE: ${CATALOG_ACCESS_MODE:-public}
      CMS_INTERNAL_URL: ${CMS_INTERNAL_URL:-http://cms:3001}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      - api

  cms:
    image: ${CMS_IMAGE:-gildra-cms:local}
    build: ./cms
    restart: unless-stopped
    environment:
      PAYLOAD_DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra_cms?sslmode=disable
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_URL: https://cms.gildra.net
      PAYLOAD_DB_PUSH: ${PAYLOAD_DB_PUSH:-false}
    volumes:
      - cms_media:/app/media
    depends_on:
      postgres: { condition: service_healthy }

  scraper:
    profiles: ["scraping"]
    image: ${SCRAPER_IMAGE:-gildra-scraper:local}
    build: ./scraper
    environment:
      SCRAPE_DO_TOKEN: ${SCRAPE_DO_TOKEN:-}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_ZONE: ${BRIGHTDATA_ZONE:-}
      BRIGHTDATA_BROWSER_ZONE: ${BRIGHTDATA_BROWSER_ZONE:-}
      BRIGHTDATA_CPM_USD: ${BRIGHTDATA_CPM_USD:-}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      ZENROWS_BASE_CPM_USD: ${ZENROWS_BASE_CPM_USD:-}
      ZYTE_API_KEY: ${ZYTE_API_KEY:-}
      ZYTE_HTTP_MAX_USD: ${ZYTE_HTTP_MAX_USD:-}
      ZYTE_BROWSER_MAX_USD: ${ZYTE_BROWSER_MAX_USD:-}
      ZYTE_CAPTURE_MAX_USD: ${ZYTE_CAPTURE_MAX_USD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    volumes:
      - scraper_state:/app/state
      - ./scraper/reports:/app/reports

  scraper-worker:
    image: ${SCRAPER_IMAGE:-gildra-scraper:local}
    build: ./scraper
    restart: unless-stopped
    entrypoint: ["python", "-m", "parsers.wowhead_dataset_daemon"]
    environment:
      DATABASE_URL: postgres://gildra:${POSTGRES_PASSWORD}@postgres:5432/gildra?sslmode=disable
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: gildra
      CLICKHOUSE_USER: gildra
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SCRAPE_DO_TOKEN: ${SCRAPE_DO_TOKEN:-}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_ZONE: ${BRIGHTDATA_ZONE:-}
      BRIGHTDATA_BROWSER_ZONE: ${BRIGHTDATA_BROWSER_ZONE:-}
      BRIGHTDATA_CPM_USD: ${BRIGHTDATA_CPM_USD:-}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      ZENROWS_BASE_CPM_USD: ${ZENROWS_BASE_CPM_USD:-}
      ZYTE_API_KEY: ${ZYTE_API_KEY:-}
      ZYTE_HTTP_MAX_USD: ${ZYTE_HTTP_MAX_USD:-}
      ZYTE_BROWSER_MAX_USD: ${ZYTE_BROWSER_MAX_USD:-}
      ZYTE_CAPTURE_MAX_USD: ${ZYTE_CAPTURE_MAX_USD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - cms

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  cms_media:
  scraper_state:
  catalog_media:
  catalog_backups:
